<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <div class="container">

        <div class="weather-card">
            <div class="theme-toggle">
            <button id="themeBtn">
             <i class="fa-solid fa-moon"></i>
            </button>
        </div>

            <!-- Search Box -->
            <div class="search-box">
                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name..."
                >
                <button id="searchBtn">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
              <button id="locationBtn">
                 <i class="fa-solid fa-location-crosshairs"></i>
                  Use My Location
              </button>

           <!-- Error Message -->
               <p class="error-message"></p>

            <!-- Loader --> 
                <div class="loader"></div>

            <!-- Weather -->
                <div class="weather">

                <img src="" alt="Weather Icon" class="weather-icon" id="weatherIcon">
                <h1 class="temperature">--°C</h1>

                <h2 class="city">City</h2>

                <p class="description">Weather Description</p>

                <div class="details">

                    <div class="detail-box">
                        <i class="fa-solid fa-droplet"></i>
                        <div>
                            <p>Humidity</p>
                            <span class="humidity">--%</span>
                        </div>
                    </div>

                    <div class="detail-box">
                        <i class="fa-solid fa-wind"></i>
                        <div>
                            <p>Wind</p>
                            <span class="wind">-- km/h</span>
                        </div>
                    </div>

                    <div class="detail-box">
                        <i class="fa-solid fa-temperature-three-quarters"></i>
                        <div>
                            <p>Feels Like</p>
                            <span class="feels-like">--°C</span>
                        </div>
                    </div>

                    <div class="detail-box">
                        <i class="fa-solid fa-eye"></i>
                        <div>
                            <p>Visibility</p>
                            <span class="visibility">-- km</span>
                        </div>
                    </div>

                    <div class="detail-box">
                        <i class="fa-solid fa-sun"></i>
                        <div>
                            <p>Sunrise</p>
                            <span class="sunrise">--:--</span>
                        </div>
                    </div>

                    <div class="detail-box">
                        <i class="fa-solid fa-moon"></i>
                        <div>
                            <p>Sunset</p>
                            <span class="sunset">--:--</span>
                        </div>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
